<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔥 Quotex Ultimate Analyzer PRO</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <header class="glass-header">
            <h1>⚡ Quotex Ultimate Analyzer <span class="badge-pro">PRO</span></h1>
            <div class="status">
                <span class="live-badge">🟢 LIVE</span>
                <span id="time"></span>
            </div>
        </header>

        <div class="control-panel glass">
            <div class="control-row">
                <div class="control-group">
                    <label>اختر الزوج:</label>
                    <select id="symbolSelect"></select>
                </div>
                <div class="control-group">
                    <label>عدد الشموع:</label>
                    <select id="limitSelect">
                        <option value="50">50</option>
                        <option value="100" selected>100</option>
                        <option value="200">200</option>
                    </select>
                </div>
                <button id="analyzeBtn" class="btn-primary"><i class="fas fa-rocket"></i> تحليل</button>
                <button id="strongBtn" class="btn-strong"><i class="fas fa-bolt"></i> إشارة قوية</button>
            </div>
        </div>

        <div id="result" class="result-container glass">
            <div class="placeholder">
                <i class="fas fa-chart-line" style="font-size:48px;color:#333;"></i>
                <p>اختر زوجاً واضغط "تحليل"</p>
            </div>
        </div>

        <footer class="footer">
            <p>⚠️ التداول يحمل مخاطر عالية | v5.0</p>
        </footer>
    </div>

    <script>
        const API = 'https://quotex-analyzer-1.onrender.com';
        
        class Analyzer {
            constructor() {
                this.init();
            }
            
            async init() {
                await this.loadMarkets();
                this.setupEvents();
                setInterval(() => {
                    document.getElementById('time').textContent = new Date().toLocaleTimeString('ar-EG');
                }, 1000);
            }
            
            async loadMarkets() {
                try {
                    const res = await fetch(`${API}/api/v1/markets`);
                    const data = await res.json();
                    const select = document.getElementById('symbolSelect');
                    select.innerHTML = data.data.map(p => 
                        `<option value="${p.symbol.replace('/', '')}">${p.symbol}</option>`
                    ).join('');
                } catch(e) {
                    console.error(e);
                }
            }
            
            setupEvents() {
                document.getElementById('analyzeBtn').onclick = () => this.analyze();
                document.getElementById('strongBtn').onclick = () => this.strongSignal();
            }
            
            async analyze() {
                const symbol = document.getElementById('symbolSelect').value;
                const limit = document.getElementById('limitSelect').value;
                const container = document.getElementById('result');
                
                container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> جاري التحليل...</div>';
                
                try {
                    const res = await fetch(`${API}/api/v2/analyze/${symbol}?limit=${limit}`);
                    const data = await res.json();
                    this.displayResult(data);
                } catch(e) {
                    container.innerHTML = `<div class="error">❌ خطأ: ${e.message}</div>`;
                }
            }
            
            async strongSignal() {
                const container = document.getElementById('result');
                container.innerHTML = '<div class="loading"><i class="fas fa-spinner fa-spin"></i> البحث عن إشارة قوية...</div>';
                
                try {
                    const res = await fetch(`${API}/api/v2/strong-signal`);
                    const data = await res.json();
                    if (data.signal) {
                        this.displayResult(data.signal);
                    } else {
                        container.innerHTML = '<div class="error">❌ لا توجد إشارات قوية حالياً</div>';
                    }
                } catch(e) {
                    container.innerHTML = `<div class="error">❌ خطأ: ${e.message}</div>`;
                }
            }
            
            displayResult(data) {
                const container = document.getElementById('result');
                const action = data.action || 'NEUTRAL';
                const isBuy = action.includes('BUY');
                const isStrong = action.startsWith('STRONG_');
                
                container.innerHTML = `
                    <div class="result-card">
                        <div class="result-header">
                            <div class="symbol">${data.symbol}</div>
                            <div class="action ${action.toLowerCase()}">
                                ${isBuy ? '🟢' : isStrong ? '🔴' : '⚪'} ${action}
                                <span class="confidence">${data.confidence}%</span>
                            </div>
                        </div>
                        <div class="stats">
                            <div class="stat"><span>السعر</span> ${data.current_price?.toFixed(5) || '--'}</div>
                            <div class="stat"><span>RSI</span> ${data.rsi?.toFixed(2) || '--'}</div>
                            <div class="stat"><span>MACD</span> ${data.macd?.histogram?.toFixed(4) || '--'}</div>
                            <div class="stat"><span>التقلب</span> ${data.volatility || '--'}</div>
                        </div>
                        ${data.signals ? `
                            <div class="signals-list">
                                ${data.signals.map(s => 
                                    `<span class="tag ${s.type.toLowerCase()}">${s.name} (${s.score})</span>`
                                ).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => new Analyzer());
    </script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Cairo',sans-serif; }
        body { background:#0a0e17; color:#fff; padding:20px; min-height:100vh; }
        .glass { background:rgba(255,255,255,0.03); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.06); border-radius:20px; padding:25px; }
        .glass-header { background:rgba(10,14,23,0.95); border-bottom:2px solid rgba(0,212,255,0.15); padding:15px 30px; margin-bottom:20px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-radius:20px; }
        h1 { font-size:24px; background:linear-gradient(135deg,#00d4ff,#7b2ffc); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .badge-pro { background:linear-gradient(135deg,#ff6b6b,#ee5a24); color:#fff; padding:2px 12px; border-radius:20px; font-size:12px; -webkit-text-fill-color:#fff; }
        .live-badge { background:#00ff88; color:#000; padding:4px 15px; border-radius:20px; font-weight:bold; font-size:12px; animation:pulse 2s infinite; }
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.5} }
        .control-panel { margin-bottom:20px; padding:20px 30px; }
        .control-row { display:flex; flex-wrap:wrap; gap:15px; align-items:flex-end; }
        .control-group { display:flex; flex-direction:column; gap:5px; flex:1; min-width:150px; }
        .control-group label { font-size:12px; color:#888; }
        select { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); color:#fff; padding:10px 15px; border-radius:12px; font-size:14px; cursor:pointer; width:100%; }
        select:focus { outline:none; border-color:#00d4ff; }
        .btn-primary, .btn-strong { padding:10px 25px; border:none; border-radius:12px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:8px; }
        .btn-primary { background:linear-gradient(135deg,#00d4ff,#7b2ffc); color:#fff; }
        .btn-primary:hover { transform:translateY(-2px); box-shadow:0 10px 40px rgba(0,212,255,0.3); }
        .btn-strong { background:linear-gradient(135deg,#ffbb00,#ff8800); color:#000; }
        .btn-strong:hover { transform:translateY(-2px); box-shadow:0 10px 40px rgba(255,187,0,0.3); }
        .result-container { min-height:300px; padding:25px; margin-bottom:20px; }
        .placeholder { text-align:center; color:#555; }
        .placeholder i { margin-bottom:15px; }
        .loading { text-align:center; padding:40px; color:#666; }
        .loading i { font-size:32px; }
        .error { text-align:center; color:#ff4444; padding:40px; }
        .result-card { width:100%; }
        .result-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; padding-bottom:15px; border-bottom:1px solid rgba(255,255,255,0.05); }
        .symbol { font-size:24px; font-weight:900; }
        .action { font-size:20px; font-weight:900; padding:8px 20px; border-radius:15px; }
        .action.buy { background:rgba(0,255,136,0.15); color:#00ff88; border:1px solid rgba(0,255,136,0.3); }
        .action.strong_buy { background:rgba(0,255,136,0.25); color:#00ff88; border:2px solid #00ff88; animation:glowBuy 1.5s infinite alternate; }
        .action.sell { background:rgba(255,68,68,0.15); color:#ff4444; border:1px solid rgba(255,68,68,0.3); }
        .action.strong_sell { background:rgba(255,68,68,0.25); color:#ff4444; border:2px solid #ff4444; animation:glowSell 1.5s infinite alternate; }
        .action.neutral { background:rgba(255,255,255,0.05); color:#888; border:1px solid rgba(255,255,255,0.1); }
        @keyframes glowBuy { from{box-shadow:0 0 20px rgba(0,255,136,0.2)} to{box-shadow:0 0 60px rgba(0,255,136,0.5)} }
        @keyframes glowSell { from{box-shadow:0 0 20px rgba(255,68,68,0.2)} to{box-shadow:0 0 60px rgba(255,68,68,0.5)} }
        .confidence { font-size:14px; font-weight:400; display:block; }
        .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:15px; margin:20px 0; }
        .stat { background:rgba(255,255,255,0.03); border-radius:12px; padding:15px; text-align:center; }
        .stat span { display:block; font-size:11px; color:#666; margin-bottom:5px; }
        .stat:last-child { font-size:18px; font-weight:700; }
        .signals-list { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
        .tag { font-size:11px; padding:3px 12px; border-radius:10px; background:rgba(255,255,255,0.05); color:#aaa; }
        .tag.buy { background:rgba(0,255,136,0.15); color:#00ff88; }
        .tag.sell { background:rgba(255,68,68,0.15); color:#ff4444; }
        .footer { margin-top:30px; padding:15px; text-align:center; font-size:12px; color:#444; background:rgba(255,255,255,0.02); border-radius:15px; }
        @media (max-width:768px) { .control-row{flex-direction:column;} .btn-primary,.btn-strong{width:100%;justify-content:center;} .result-header{flex-direction:column;text-align:center;} }
    </style>
</body>
</html>
